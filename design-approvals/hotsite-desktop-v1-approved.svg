  <text x="98" y="1245" class="label" font-size="9" fill="#FF6B57">ANUNCIE AQUI</text><text x="218" y="1245" class="body" font-size="11">Fortaleça o movimento surf e conecte sua marca à comunidade.</text>
  <text x="1500" y="1245" text-anchor="end" class="label" font-size="9">CANDIDATO À APROVAÇÃO</text>
