  <rect x="126" y="425" width="22" height="17" rx="3" fill="none" stroke="#F4F6F7" stroke-width="2"/><path d="M127 427l10 8 10-8" stroke="#F4F6F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
