  <text x="100" y="172" class="label" font-size="11" fill="#9FD3C6">PREVISÃO + COMUNIDADE SURF</text>
  <text x="100" y="244" class="display" font-size="58">Qual praia hoje?</text>
  <text x="100" y="292" class="title" font-size="24">Decida melhor. Chegue na hora certa.</text>
  <text x="100" y="337" class="body" font-size="17" fill="#E1E9ED">Maré, ondas, vento e relatos de quem está na água: </text>
  <text x="100" y="364" class="body" font-size="17" fill="#E1E9ED">reunidos em uma leitura simples para o seu próximo surf.</text>
