  <rect x="796" y="928" width="732" height="272" rx="28" fill="url(#seaCard)" stroke="#9FD3C6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="824" y="950" width="116" height="28" rx="14" fill="#FF6B57"/><text x="882" y="968" text-anchor="middle" class="title" font-size="10">RECOMENDADO</text>
  <text x="824" y="1014" class="title" font-size="21">Colaborador</text><text x="824" y="1056" class="data" font-size="34">R$ 9,90</text><text x="968" y="1056" class="body" font-size="12">por mês</text>
  <circle cx="832" cy="1090" r="4" fill="#9FD3C6"/><text x="848" y="1095" class="body" font-size="12">Tudo do Gratuito + previsão estendida</text>
  <circle cx="832" cy="1122" r="4" fill="#9FD3C6"/><text x="848" y="1127" class="body" font-size="12">Comparação, alertas e favoritos sem limite</text>
  <circle cx="832" cy="1154" r="4" fill="#9FD3C6"/><text x="848" y="1159" class="body" font-size="12">Navegação sem anúncios e apoio ao movimento surf</text>
  <rect x="1262" y="1050" width="226" height="52" rx="15" fill="#FF6B57"/><text x="1375" y="1082" text-anchor="middle" class="title" font-size="13">Quero colaborar</text>

