  <image href="../public/brand/final/quipraia-3c-wordmark-dark-approved.svg" x="72" y="28" width="224" height="38"/>
  <text x="670" y="57" class="body" font-size="13">Como funciona</text><text x="802" y="57" class="body" font-size="13">Praias</text><text x="876" y="57" class="body" font-size="13">Comunidade</text><text x="986" y="57" class="body" font-size="13">Planos</text>
