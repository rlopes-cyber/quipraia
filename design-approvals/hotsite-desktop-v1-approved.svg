  <text x="72" y="910" class="display" font-size="30">Comece grátis. Fortaleça quando quiser.</text>
  <rect x="72" y="940" width="700" height="248" rx="26" fill="#102638" stroke="#365064"/>
  <text x="104" y="982" class="title" font-size="21">Gratuito</text><text x="104" y="1022" class="data" font-size="32">R$ 0</text><text x="192" y="1022" class="body" font-size="12">para começar</text>
