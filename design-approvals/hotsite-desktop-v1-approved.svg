    <circle cx="203" cy="7" r="7" fill="#9FD3C6" opacity=".18"/><circle cx="203" cy="7" r="3" fill="#9FD3C6"/><text x="220" y="12" class="body" font-size="12" fill="#F4F6F7">Dados atualizados</text>
    <circle cx="382" cy="7" r="7" fill="#9FD3C6" opacity=".18"/><circle cx="382" cy="7" r="3" fill="#9FD3C6"/><text x="399" y="12" class="body" font-size="12" fill="#F4F6F7">Feito para surfistas</text>
