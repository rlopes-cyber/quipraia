<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000"><stop stop-color="#0B1D2D"/><stop offset="1" stop-color="#102A3C"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="10" stdDeviation="14" flood-color="#020A10" flood-opacity=".25"/></filter><style>.display{font-family:Sora,Inter,sans-serif;font-weight:700;fill:#F4F6F7}.title{font-family:Sora,Inter,sans-serif;font-weight:600;fill:#F4F6F7}.body{font-family:Inter,Arial,sans-serif;font-weight:500;fill:#AFC0CD}.label{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#6B8194;letter-spacing:1.4px}.border{stroke:#365064;stroke-width:1}.line{stroke:#9FD3C6;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style></defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1480" cy="-30" r="310" fill="#9FD3C6" opacity=".035"/>
  <image href="../public/brand/final/quipraia-3c-wordmark-dark-approved.svg" x="72" y="42" width="276" height="42"/><text x="72" y="134" class="display" font-size="38">Estados e responsividade</text><text x="72" y="166" class="body" font-size="15">O sistema continua claro quando os dados ainda não chegaram, falharam ou não existem.</text>
  <rect x="1344" y="51" width="184" height="38" rx="19" fill="#132F42" class="border"/><circle cx="1370" cy="70" r="5" fill="#9FD3C6"/><text x="1386" y="75" class="label" font-size="10">RESILIÊNCIA 1.0</text>

  <!-- states -->
  <text x="72" y="224" class="label" font-size="10">01 · ESTADOS DE INTERFACE</text>
  <g>
    <rect x="72" y="246" width="344" height="220" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="98" y="280" class="label" font-size="9">CARREGANDO</text><rect x="98" y="306" width="216" height="20" rx="10" fill="#173146"/><rect x="98" y="340" width="292" height="70" rx="15" fill="#0B1D2D"/><rect x="116" y="358" width="64" height="14" rx="7" fill="#173146"/><rect x="116" y="384" width="180" height="10" rx="5" fill="#173146"/><circle cx="370" cy="430" r="12" fill="none" stroke="#9FD3C6" stroke-width="2" stroke-dasharray="20 15"/><text x="98" y="440" class="body" font-size="10">Buscando a previsão mais recente…</text>
    <rect x="438" y="246" width="344" height="220" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="464" y="280" class="label" font-size="9">SEM FAVORITOS</text><path d="M604 314c-20-22-55 10 6 56 61-46 26-78 6-56l-6 7-6-7z" fill="none" stroke="#9FD3C6" stroke-width="2"/><text x="610" y="398" text-anchor="middle" class="title" font-size="15">Sua lista começa no mapa.</text><text x="610" y="420" text-anchor="middle" class="body" font-size="10">Favorite praias para comparar rapidamente.</text><rect x="544" y="434" width="132" height="26" rx="9" fill="#173146"/><text x="610" y="451" text-anchor="middle" class="title" font-size="9" fill="#9FD3C6">Explorar mapa</text>
    <rect x="804" y="246" width="344" height="220" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="830" y="280" class="label" font-size="9">DADOS ATRASADOS</text><circle cx="976" cy="332" r="24" fill="#2B3036"/><path d="M976 319v15l10 6" stroke="#FFB49F" stroke-width="2"/><text x="976" y="386" text-anchor="middle" class="title" font-size="15">Previsão de 2 horas atrás.</text><text x="976" y="408" text-anchor="middle" class="body" font-size="10">Você pode consultar, mas considere a defasagem.</text><rect x="914" y="432" width="124" height="26" rx="9" fill="#2B3036"/><text x="976" y="449" text-anchor="middle" class="title" font-size="9" fill="#FFB49F">Tentar atualizar</text>
    <rect x="1170" y="246" width="358" height="220" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="1196" y="280" class="label" font-size="9">SEM CONEXÃO</text><path d="M1325 348c14-13 34-13 48 0M1333 357c10-9 22-9 32 0M1342 367c5-4 9-4 14 0M1314 315l72 72" stroke="#9FD3C6" stroke-width="2" stroke-linecap="round"/><text x="1349" y="411" text-anchor="middle" class="title" font-size="15">Você está offline.</text><text x="1349" y="433" text-anchor="middle" class="body" font-size="10">Mostrando os últimos dados salvos.</text>
  </g>

  <g>
    <rect x="72" y="490" width="344" height="180" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="98" y="524" class="label" font-size="9">ERRO NO ENVIO</text><circle cx="122" cy="568" r="18" fill="#2B3036"/><text x="122" y="574" text-anchor="middle" class="title" font-size="18" fill="#FFB49F">!</text><text x="154" y="560" class="title" font-size="13">Não foi possível publicar.</text><text x="154" y="581" class="body" font-size="10">Sua foto foi mantida. Tente novamente.</text><rect x="98" y="612" width="122" height="34" rx="11" fill="#FF6B57"/><text x="159" y="633" text-anchor="middle" class="title" font-size="9">Tentar novamente</text><text x="250" y="633" class="body" font-size="9">Cancelar</text>
    <rect x="438" y="490" width="344" height="180" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="464" y="524" class="label" font-size="9">SUCESSO</text><circle cx="488" cy="568" r="18" fill="#173A46"/><path d="M480 568l6 6 11-14" stroke="#9FD3C6" stroke-width="2"/><text x="520" y="560" class="title" font-size="13">Relato publicado.</text><text x="520" y="581" class="body" font-size="10">Obrigado por ajudar quem está indo ao mar.</text><rect x="464" y="612" width="122" height="34" rx="11" fill="#173146"/><text x="525" y="633" text-anchor="middle" class="title" font-size="9" fill="#9FD3C6">Ver na comunidade</text>
    <rect x="804" y="490" width="344" height="180" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="830" y="524" class="label" font-size="9">LOCALIZAÇÃO NEGADA</text><path d="M854 552c-8 0-13 11 0 27 13-16 8-27 0-27z" fill="none" stroke="#9FD3C6" stroke-width="1.8"/><path d="M835 545l38 38" stroke="#FF6B57" stroke-width="2"/><text x="894" y="560" class="title" font-size="13">Escolha sua cidade.</text><text x="894" y="581" class="body" font-size="10">O mapa funciona mesmo sem GPS.</text><rect x="830" y="612" width="132" height="34" rx="11" fill="#173146"/><text x="896" y="633" text-anchor="middle" class="title" font-size="9" fill="#9FD3C6">Selecionar cidade</text>
    <rect x="1170" y="490" width="358" height="180" rx="22" fill="#102638" class="border" filter="url(#shadow)"/><text x="1196" y="524" class="label" font-size="9">ACESSO RESTRITO</text><rect x="1196" y="548" width="32" height="28" rx="7" fill="none" stroke="#9FD3C6"/><path d="M1203 548v-7c0-11 18-11 18 0v7" stroke="#9FD3C6" stroke-width="1.8"/><text x="1246" y="558" class="title" font-size="13">Área administrativa.</text><text x="1246" y="579" class="body" font-size="10">Sua conta não possui essa permissão.</text><rect x="1196" y="612" width="118" height="34" rx="11" fill="#173146"/><text x="1255" y="633" text-anchor="middle" class="title" font-size="9" fill="#9FD3C6">Voltar ao início</text>
  </g>

  <!-- responsive -->
  <text x="72" y="726" class="label" font-size="10">02 · COMPORTAMENTO RESPONSIVO</text>
  <rect x="72" y="748" width="1456" height="188" rx="24" fill="#102638" class="border" filter="url(#shadow)"/>
  <g transform="translate(108 774)">
    <rect width="126" height="136" rx="18" fill="#0B1D2D" stroke="#365064"/><rect x="12" y="14" width="102" height="14" rx="7" fill="#173146"/><rect x="12" y="40" width="102" height="46" rx="11" fill="#173A46"/><rect x="12" y="96" width="48" height="28" rx="8" fill="#9FD3C6"/><rect x="66" y="96" width="48" height="28" rx="8" fill="#173146"/>
    <text x="154" y="30" class="title" font-size="14">Mobile · 0–767</text><text x="154" y="54" class="body" font-size="10">1 coluna · margem 16 · navegação inferior.</text><text x="154" y="76" class="body" font-size="10">Gráficos com rolagem horizontal quando necessário.</text>
  </g>
  <line x1="540" y1="774" x2="540" y2="910" stroke="#294458"/>
  <g transform="translate(580 774)">
    <rect width="188" height="136" rx="18" fill="#0B1D2D" stroke="#365064"/><rect x="12" y="14" width="164" height="14" rx="7" fill="#173146"/><rect x="12" y="40" width="78" height="72" rx="11" fill="#173A46"/><rect x="98" y="40" width="78" height="72" rx="11" fill="#173146"/>
    <text x="216" y="30" class="title" font-size="14">Tablet · 768–1199</text><text x="216" y="54" class="body" font-size="10">2 colunas · margem 24 · navegação compacta.</text><text x="216" y="76" class="body" font-size="10">Mapa e detalhes alternam prioridade.</text>
  </g>
  <line x1="1034" y1="774" x2="1034" y2="910" stroke="#294458"/>
  <g transform="translate(1074 774)">
    <rect width="224" height="136" rx="18" fill="#0B1D2D" stroke="#365064"/><rect x="12" y="14" width="38" height="110" rx="8" fill="#173146"/><rect x="60" y="14" width="152" height="14" rx="7" fill="#173146"/><rect x="60" y="40" width="94" height="72" rx="11" fill="#173A46"/><rect x="162" y="40" width="50" height="72" rx="11" fill="#173146"/>
    <text x="252" y="30" class="title" font-size="14">Desktop · 1200+</text><text x="252" y="54" class="body" font-size="10">12 colunas · sidebar · conteúdo simultâneo.</text><text x="252" y="76" class="body" font-size="10">Largura máxima 1440 para preservar leitura.</text>
  </g>
  <text x="72" y="972" class="body" font-size="10">Todo estado combina ícone, texto e cor. Skeleton preserva o espaço do conteúdo; nenhum erro apaga os últimos dados válidos.</text><text x="1528" y="972" text-anchor="end" class="label" font-size="9">CANDIDATO À APROVAÇÃO</text>
</svg>
