    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#07131E" stop-opacity=".98"/><stop offset=".5" stop-color="#07131E" stop-opacity=".72"/><stop offset="1" stop-color="#07131E" stop-opacity=".25"/></linearGradient>
    <linearGradient id="seaCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173A46"/><stop offset="1" stop-color="#102638"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dy="18" stdDeviation="22" flood-color="#020A10" flood-opacity=".4"/></filter>
